[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "galbot-sdk-web-console"
version = "0.1.0"
description = "Web console for monitoring, visualizing, and operating Galbot robots through the Galbot SDK"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jiajuejie", email = "jiajuejie@galbot.com" }]
dependencies = [
  "fastapi>=0.110,<1.0",
  "numpy>=1.26,<3.0",
  "pydantic>=2.0,<3.0",
  "rerun-sdk==0.37.2",
  "uvicorn[standard]>=0.29,<1.0",
]

[project.scripts]
galbot-sdk-web-console = "galbot_sdk_web_console.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/galbot_sdk_web_console"]

[tool.uv]
package = true

[dependency-groups]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
